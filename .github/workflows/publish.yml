# Renderiza o site (e o PDF) com Quarto e publica no GitHub Pages a cada push no main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.24

      # Os diagramas Mermaid do PDF são convertidos em imagem por um Chromium headless.
      # No Ubuntu 24.04, o AppArmor bloqueia os user namespaces que ele usa e o render trava.
      - name: Instalar Chromium para os diagramas do PDF
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          quarto install chromium --no-prompt

      - name: Renderizar
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
